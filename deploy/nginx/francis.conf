# Nginx (no HOST da VPS, não em container) — proxy reverso + terminação TLS.
#
# Instalação: copiar para /etc/nginx/sites-available/francis.conf, criar o
# symlink em sites-enabled, e rodar o Certbot (ETAPA 20 do runbook), que
# reescreve este arquivo adicionando os blocos 443/SSL automaticamente.
#
# Trocar `SEUDOMINIO.com` pelo domínio real antes de usar.

# ---------- Dashboard: app.SEUDOMINIO.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name app.SEUDOMINIO.com;

    # Upload de mídia pelo operador: o teto da aplicação é 16MB (F1.3/F1.10).
    # O default do Nginx é 1MB — sem esta linha, todo envio de arquivo maior
    # falha com 413 antes mesmo de chegar na aplicação.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Necessário para o Next.js montar URLs/redirects corretos e para a
        # aplicação enxergar o IP real do cliente (o rate limit de login por
        # IP, M5, depende disso — sem X-Forwarded-For todo mundo aparece como
        # 127.0.0.1 e um único atacante consumiria a cota de todos).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # O tempo real do produto é polling de 2–4s; a folga abaixo cobre
        # respostas de IA mais lentas sem derrubar a conexão no meio.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------- API: api.SEUDOMINIO.com ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.SEUDOMINIO.com;

    client_max_body_size 20M;

    # A rota /internal/* (download de mídia pelo worker, F1.2) só deve ser
    # alcançável de dentro da rede do Docker — o worker chama http://api:4000
    # diretamente, sem passar por aqui. Bloquear explicitamente na borda evita
    # que ela fique exposta caso o segredo compartilhado vaze algum dia.
    location /internal/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
